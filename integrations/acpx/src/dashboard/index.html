<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<title>Worker Routing · Dispatch</title>
<!-- SPDX-License-Identifier: SUL-1.0 -->
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a href="#main" class="skip" id="skip">跳到内容</a>
<div class="shell">
<header class="masthead">
 <a class="brand" href="#" id="home-link" aria-label="Worker Routing 首页"><span class="brand-mark" id="canon"></span><span><strong>worker routing</strong><small id="brand-edition">DISPATCH / 协作手记</small></span></a>
 <nav class="nav-tabs" aria-label="视图"><button data-view="overview" id="nav-overview"></button><button data-view="records" id="nav-records"></button></nav>
 <div class="head-actions"><button id="language" class="language" aria-label="Switch language">EN</button><button id="share-open" class="primary"></button></div>
</header>
<div class="context-row"><button class="local-tag" id="local-info"></button><button class="theme-open" id="theme-open"></button></div>
<main id="main" tabindex="-1"><p id="notice" class="notice" role="status" hidden></p>
 <section class="intro"><div><p class="eyebrow">A LITTLE HELP. ROOM TO BLOOM.</p><h1 id="heading"></h1><p class="lede" id="intro-text"></p></div><div class="intro-ornament" id="intro-ornament" aria-hidden="true"></div><div class="window-controls"><div class="segments" id="period-options"></div><p id="range-label" class="range-label"></p><label class="timezone-control"><span id="timezone-label"></span><select id="timezone"></select></label></div></section>
 <div id="overview-view">
  <section class="hero" aria-labelledby="hero-title">
   <div class="hero-main"><p class="label" id="hero-title"></p><div class="hero-number"><strong id="task-number"></strong><span id="task-unit"></span></div><p class="hero-note" id="task-note"></p></div>
   <figure class="companion"><div class="seal" id="companion-seal"></div><figcaption id="seal-caption"></figcaption></figure>
   <div class="hero-bottom"><div class="secondary-stat"><div><strong id="turn-number"></strong><span id="turn-label"></span></div><p id="turn-note"></p></div><div class="secondary-stat tokens"><div><strong id="token-number"></strong><span>tokens</span><button id="coverage-pill" class="coverage-pill"></button></div><p id="coverage-note"></p></div></div>
  </section>
  <section class="outcomes" aria-labelledby="outcome-heading"><div class="outcome-top"><h2 id="outcome-heading"></h2><p id="outcome-note"></p></div><div id="status-track" class="status-track" aria-hidden="true"></div><div id="status-buttons" class="status-buttons"></div></section>
  <div class="analysis-grid">
   <section class="panel activity-panel" aria-labelledby="activity-title"><header class="panel-heading"><div><p class="eyebrow">01 / THE WORK ADDS UP</p><h2 id="activity-title"></h2></div><div class="segments compact-segments" id="measure-options"></div></header><div class="chart-readout"><div><strong id="chart-total"></strong><span id="chart-unit"></span></div><span id="chart-hint"></span></div><div class="plot" id="activity"></div><p class="chart-note" id="chart-note"></p></section>
   <aside class="side-stack"><section class="panel route-panel" aria-labelledby="routes-title"><header class="panel-heading"><div><p class="eyebrow">02 / IN GOOD COMPANY</p><h2 id="routes-title"></h2></div></header><div id="route-rows"></div><p class="chart-note" id="routes-note"></p></section><section class="review-note"><div class="review-head"><span class="thread-icon" aria-hidden="true">↳</span><h2 id="review-title"></h2></div><div id="review-actions"></div><p id="review-description"></p></section></aside>
  </div>
  <div class="trail-grid"><section class="recent-panel" aria-labelledby="recent-title"><header class="panel-heading"><div><p class="eyebrow">03 / SESSIONS</p><h2 id="recent-title"></h2></div><span class="quiet-note" id="recent-note"></span></header><div id="recent-list"></div></section><section class="transport-panel" aria-labelledby="transport-title"><header class="panel-heading"><div><p class="eyebrow">04 / RUNTIME NOTES</p><h2 id="transport-title"></h2></div><span class="runtime-symbol" aria-hidden="true">↝</span></header><div id="transport-summary"></div><div id="transport-list"></div><p class="chart-note" id="transport-note"></p><small id="runtime-caption"></small></section></div><div class="browse-strip"><span class="browse-ornament" id="browse-ornament" aria-hidden="true"></span><p id="browse-description"></p><button class="text-link" id="browse-records"></button></div>
 </div>
 <section id="records-view" hidden aria-labelledby="records-heading"><div class="records-head"><div><p class="eyebrow">THE COLLABORATION TRAIL</p><h2 id="records-heading"></h2></div><button id="back-overview" class="text-link"></button></div><div class="workspace-browser"><div class="workspace-heading"><h3 id="workspace-title"></h3><span id="workspace-count"></span><input type="search" id="workspace-search" autocomplete="off"></div><div id="workspace-list" class="workspace-list"></div><p id="workspace-note" class="quiet-note"></p></div><div class="record-tools"><div id="record-options" class="record-options"></div><label class="search-box"><span aria-hidden="true">⌕</span><input type="search" id="record-search" autocomplete="off"></label></div><label class="folder-filter" id="folder-filter" hidden><span id="folder-label"></span><select id="folder-select"></select></label><div id="filter-summary" class="filter-summary" aria-live="polite"></div><div id="record-list"></div><button id="more-records" class="secondary more"></button></section>
</main>
<footer class="footer"><div><strong id="footer-scope"></strong><p id="footer-note"></p></div><div class="footer-actions"><button id="refresh" class="text-link"></button><button id="data-open" class="text-link"></button><button id="stop" class="text-link"></button></div></footer>
</div>
<dialog id="theme-dialog" aria-labelledby="theme-title"><div class="dialog-head"><div><p class="eyebrow">PAPER & COMPANIONS</p><h2 id="theme-title"></h2></div><button class="close" data-close="theme-dialog" aria-label="Close">×</button></div><div id="theme-choices" class="theme-choices"></div><p class="dialog-note" id="theme-note"></p></dialog>
<dialog id="data-dialog" aria-labelledby="data-title"><div class="dialog-head"><div><p class="eyebrow">ABOUT THESE NUMBERS</p><h2 id="data-title"></h2></div><button class="close" data-close="data-dialog" aria-label="Close">×</button></div><div id="data-content"></div></dialog>
<dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="dialog-head"><span class="eyebrow">COLLABORATION / REPLAY</span><button class="close" data-close="detail-dialog" aria-label="Close">×</button></div><div id="detail-content"></div></dialog>
<dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title"><div class="dialog-head"><div><p class="eyebrow">A LITTLE RECORD TO KEEP</p><h2 id="share-title"></h2></div><button class="close" data-close="share-dialog" aria-label="Close">×</button></div><div class="share-layout"><div class="share-preview-column"><div class="share-preview" id="share-preview"></div><p class="share-draft-note" id="share-draft-note"></p></div><div class="share-controls"><p id="share-scope"></p><fieldset><legend id="format-legend"></legend><div id="share-formats" class="segments"></div></fieldset><fieldset><legend id="lang-legend"></legend><div id="share-languages" class="segments"></div></fieldset><fieldset class="share-writing"><legend id="share-writing-legend"></legend><label class="share-field" for="share-preset"><span id="share-preset-label"></span><select id="share-preset"></select></label><label class="share-field" for="share-slogan"><span class="field-heading"><span id="share-slogan-label"></span><small id="share-slogan-count"></small></span><textarea id="share-slogan" rows="3" aria-describedby="share-slogan-hint" spellcheck="false"></textarea></label><p class="field-hint" id="share-slogan-hint"></p><label class="share-field" for="share-by"><span id="share-by-label"></span><input id="share-by" type="text" autocomplete="off" spellcheck="false"></label></fieldset><fieldset><legend id="share-theme-legend"></legend><div id="share-themes" class="share-theme-choices"></div></fieldset><fieldset><legend id="share-number-legend"></legend><div class="number-choices" id="share-number-styles"></div></fieldset><fieldset><legend id="share-ornament-legend"></legend><div class="ornament-choices" id="share-ornaments"></div></fieldset><button id="share-reset" class="text-link share-reset"></button><div class="download-actions"><button id="save-png" class="primary">PNG ↓</button><button id="save-svg" class="secondary">SVG ↓</button></div><button id="copy-caption" class="secondary full"></button><p class="export-note" id="export-note"></p><div class="logo-downloads"><a href="/mark.svg" download="worker-routing-mark.svg" id="mark-download"></a><a href="/logo.svg" download="worker-routing-cat.svg" id="cat-download"></a></div><details class="caption-fallback"><summary id="caption-summary"></summary><textarea id="caption-text" readonly rows="6"></textarea></details></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Dispatch 需要 JavaScript 才能显示本地 ACP 回执。</noscript>
<script type="module" src="/app.mjs"></script>
</body>
</html>
